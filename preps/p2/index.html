<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="carousel">
        <input type="radio" name="word" id="word-1" checked>
        <input type="radio" name="word" id="word-2">
        <input type="radio" name="word" id="word-3">
        <input type="radio" name="word" id="word-4">
        <input type="radio" name="word" id="word-5">
        <input type="radio" name="word" id="word-6">

        <p class="slide slide-1">hello</p>
        <p class="slide slide-2">this</p>
        <p class="slide slide-3">is</p>
        <p class="slide slide-4">my</p>
        <p class="slide slide-5">website</p>
        <p class="slide slide-6">!!!</p>

        <div class="controls controls-1"><label for="word-2">&gt;</label></div>
        <div class="controls controls-2"><label for="word-1">&lt;</label><label for="word-3">&gt;</label></div>
        <div class="controls controls-3"><label for="word-2">&lt;</label><label for="word-4">&gt;</label></div>
        <div class="controls controls-4"><label for="word-3">&lt;</label><label for="word-5">&gt;</label></div>
        <div class="controls controls-5"><label for="word-4">&lt;</label><label for="word-6">&gt;</label></div>
        <div class="controls controls-6"><label for="word-5">&lt;</label></div>
    </div>
</body>
</html>
